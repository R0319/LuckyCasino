# 既定の言語（ja / en）。リソースパックを入れた Java 版の人には、その人のゲームの言語（日本語以外は英語）で出ます。
# パックを入れていない人・統合版の人・サーバーのログはこの言語です。
# Default language (ja / en). Java players with the resource pack see their own game language (English unless Japanese).
# Players without the pack, Bedrock players and the server log use this language.
language: ja

# 通貨
economy:
  # auto: Vault の経済プラグインがあればそのお金、無ければ練習用 / vault / practice
  mode: auto
  # チップ 1 枚がいくらか
  money-per-chip: 1.0
  # 練習用のとき、席に着くと配るチップの枚数
  practice-chips: 1000

# 収支のランキング（/casino top）。席を立つたびに「戻したチップ - 両替したチップ」を足す
ranking:
  # file: このサーバーの plugins/LuckyCasino/stats.yml に記録する
  # mysql: MySQL・MariaDB に記録する（同じ DB を使うサーバーどうしで 1 つのランキングになる）。
  #        つながらないときは file で動きます
  storage: file
  mysql:
    host: 127.0.0.1
    port: 3306
    database: luckycasino
    user: luckycasino
    password: ''
    # 表の名前の頭につける文字（英数字と _）
    table-prefix: luckycasino_
    # ほかのサーバーの記録を読み直す間隔（秒）
    refresh-seconds: 30

# ブラックジャックのルール（全テーブル共通）
blackjack:
  decks: 6
  dealer-hits-soft-17: false
  double-after-split: true
  min-bet: 10
  max-bet: 1000
  # 最初の人が賭けてから配り始めるまで（秒）
  betting-seconds: 15
  # 1 回の行動の制限時間（秒）
  turn-seconds: 20
  # 席に着くときに選べるチップの枚数（最大 5 つ）
  buy-ins: [100, 500, 1000, 5000]

# ルーレットのルール（ヨーロピアン、0 は 1 つ）
roulette:
  # 1 か所に置ける最低額・最高額
  min-bet: 10
  max-bet: 500
  # 1 回に 1 人が賭けられる合計
  max-total: 2000
  # 最初の人が賭けてから締め切るまで（秒）
  betting-seconds: 20
  buy-ins: [100, 500, 1000, 5000]
  # 賭けたあと（と回っている間）は、スニークで立っても精算せずに歩ける。卓からこの距離（ブロック）を超えたら精算
  standing-range: 8

# ポーカーのルール（テキサスホールデム、ノーリミット。ディーラーは配るだけで手数料は取らない）
poker:
  small-blind: 5
  big-blind: 10
  # 1 回の行動の制限時間（秒）。過ぎるとチェックかフォールド
  turn-seconds: 25
  # 2 人そろってから（前の勝負が終わってから）配るまで（秒）
  start-seconds: 5
  buy-ins: [200, 500, 1000, 2000]

# スロットマシン（1 人用、リール 3 本・5 ライン固定）
slot:
  # 1 回に賭けられる額（最大 5 つ）。5 ラインに等分するので 5 の倍数だけ（それ以外は無視）
  bets: [10, 50, 100]
  buy-ins: [100, 500, 1000, 5000]
  # 配当（1 ラインの賭け金の何倍が戻るか、賭け金を含む）。既定は還元率 96.0%、何か戻る確率 65.4%。
  # 変えたときの還元率は起動時のログに出ます
  paytable:
    sevens: 300
    bars: 50
    bells: 20
    melons: 15
    lemons: 10
    # チェリーは左のリールから数える
    cherry1: 1
    cherry2: 4
    cherry3: 20

# バカラ（プント・バンコ、8 デッキ）。席ごとの枠にプレイヤー・バンカー・タイ・ペアを賭ける
baccarat:
  # 1 か所に置ける最低額・最高額
  min-bet: 10
  max-bet: 1000
  # 1 回に 1 人が賭けられる合計
  max-total: 2000
  # 最初の人が賭けてから締め切るまで（秒）
  betting-seconds: 15
  buy-ins: [100, 500, 1000, 5000]
  # 賭けたあと（と勝負の間）は、スニークで立っても精算せずに歩ける。卓からこの距離（ブロック）を超えたら精算
  standing-range: 8

# ビッグホイール（54 マス）。1・2・5・10・20・ジョーカー・ロゴに賭ける
bigwheel:
  min-bet: 10
  max-bet: 500
  max-total: 2000
  betting-seconds: 15
  buy-ins: [100, 500, 1000, 5000]
  standing-range: 8

# チンチロ（座敷）。子として張り、親と役の強さで勝負する。負けると最大 5 倍払うので、
# 張ったあとも賭け金の 4 倍を手元に残す必要がある（max-bet と max-total は同じ値にする）
chinchiro:
  min-bet: 10
  max-bet: 200
  max-total: 200
  betting-seconds: 15
  buy-ins: [100, 500, 1000, 5000]
  standing-range: 8

# ハイ＆ロー。基準のカードより次のカードが上か下か同じかに賭ける
highlow:
  min-bet: 10
  max-bet: 500
  max-total: 1500
  betting-seconds: 12
  buy-ins: [100, 500, 1000, 5000]
  standing-range: 8

# 競馬（6 頭、単勝）。レースごとに馬の強さと配当が変わる
horserace:
  min-bet: 10
  max-bet: 500
  max-total: 1500
  betting-seconds: 15
  buy-ins: [100, 500, 1000, 5000]
  standing-range: 8

# カジノホールデム。1 人ずつディーラーと勝負する。アンティを賭けたあと、コール（アンティの 2 倍）に備えて
# 手元にアンティの 2 倍を残す必要がある（max-bet と max-total は同じ値にする）
holdem:
  min-bet: 10
  max-bet: 300
  max-total: 300
  betting-seconds: 15
  buy-ins: [100, 500, 1000, 5000]
  standing-range: 8

# テーブルのクラフトレシピ。材料は素材名か、#planks のようなタグ名。使わないなら enabled: false
recipes:
  blackjack:
    enabled: true
    shape:
      - CCC
      - PPP
      - ' G '
    ingredients:
      C: green_carpet
      P: '#planks'
      G: gold_ingot
  roulette:
    enabled: true
    shape:
      - RKR
      - PGP
      - 'P P'
    ingredients:
      R: red_carpet
      K: black_carpet
      P: '#planks'
      G: gold_ingot
  poker:
    enabled: true
    shape:
      - CCC
      - PEP
      - 'P P'
    ingredients:
      C: green_carpet
      P: '#planks'
      E: emerald
  slot:
    enabled: true
    shape:
      - IGI
      - RDR
      - III
    ingredients:
      I: iron_ingot
      G: glass_pane
      R: redstone
      D: gold_ingot
  baccarat:
    enabled: true
    shape:
      - BCR
      - PGP
      - 'P P'
    ingredients:
      B: blue_carpet
      C: green_carpet
      R: red_carpet
      P: '#planks'
      G: gold_ingot
  bigwheel:
    enabled: true
    shape:
      - YBO
      - PCP
      - 'P P'
    ingredients:
      Y: yellow_carpet
      B: blue_carpet
      O: orange_carpet
      P: '#planks'
      C: clock
  chinchiro:
    enabled: true
    shape:
      - CBC
      - PSP
      - 'P P'
    ingredients:
      C: purple_carpet
      B: bowl
      P: '#planks'
      S: bone_block
  highlow:
    enabled: true
    shape:
      - LPA
      - WBW
      - 'W W'
    ingredients:
      L: lime_carpet
      P: paper
      A: light_blue_carpet
      W: '#planks'
      B: book
  horserace:
    enabled: true
    shape:
      - WHW
      - PSP
      - 'P P'
    ingredients:
      W: white_carpet
      H: hay_block
      P: '#planks'
      S: saddle
  holdem:
    enabled: true
    shape:
      - LLL
      - PGP
      - 'P P'
    ingredients:
      L: lime_carpet
      P: '#planks'
      G: gold_ingot

# Geyser 拡張（統合版にカードを見せる）との通信
bridge:
  # false にすると通信しない（統合版にはカードが見えなくなる）
  enabled: true
  # Geyser が動いているマシンの IP アドレス（同じサーバーに入れたときは 127.0.0.1）
  host: 127.0.0.1
  port: 25590
  # Geyser 拡張の config.properties にある key と同じ値を入れる
  key: ''

# Java 版プレイヤーに送るリソースパック。参加の前（読み込み画面）に送る
resource-pack:
  # 空（既定）: url があれば送り、無ければ送らない
  # external: Nexo やプロキシのプラグインなど、ほかの仕組みがこのパックを混ぜて必ず配るとき。
  #           このプラグインは送らず、Java 版の人には全員カードの絵を出す（配る側で「必須」にしておく）
  # off: 送らず、絵も出さない
  mode: ''
  url: ''
  # zip の SHA-1（小文字 16 進 40 文字）
  sha1: ''
