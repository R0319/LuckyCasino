# 通貨
economy:
  # auto: Vault の経済プラグインがあればそのお金、無ければ練習用 / vault / practice
  mode: auto
  # チップ 1 枚がいくらか
  money-per-chip: 1.0
  # 練習用のとき、席に着くと配るチップの枚数
  practice-chips: 1000

# ブラックジャックのルール（全テーブル共通）
blackjack:
  decks: 6
  dealer-hits-soft-17: false
  double-after-split: true
  min-bet: 10
  max-bet: 1000
  # 最初の人が賭けてから配り始めるまで（秒）
  betting-seconds: 15
  # 1 回の行動の制限時間（秒）
  turn-seconds: 20
  # 席に着くときに選べるチップの枚数（最大 5 つ）
  buy-ins: [100, 500, 1000, 5000]

# ルーレットのルール（ヨーロピアン、0 は 1 つ）
roulette:
  # 1 か所に置ける最低額・最高額
  min-bet: 10
  max-bet: 500
  # 1 回に 1 人が賭けられる合計
  max-total: 2000
  # 最初の人が賭けてから締め切るまで（秒）
  betting-seconds: 20
  buy-ins: [100, 500, 1000, 5000]

# ポーカーのルール（テキサスホールデム、ノーリミット。ディーラーは配るだけで手数料は取らない）
poker:
  small-blind: 5
  big-blind: 10
  # 1 回の行動の制限時間（秒）。過ぎるとチェックかフォールド
  turn-seconds: 25
  # 2 人そろってから（前の勝負が終わってから）配るまで（秒）
  start-seconds: 5
  buy-ins: [200, 500, 1000, 2000]

# テーブルのクラフトレシピ。材料は素材名か、#planks のようなタグ名。使わないなら enabled: false
recipes:
  blackjack:
    enabled: true
    shape:
      - CCC
      - PPP
      - ' G '
    ingredients:
      C: green_carpet
      P: '#planks'
      G: gold_ingot
  roulette:
    enabled: true
    shape:
      - RKR
      - PGP
      - 'P P'
    ingredients:
      R: red_carpet
      K: black_carpet
      P: '#planks'
      G: gold_ingot
  poker:
    enabled: true
    shape:
      - CCC
      - PEP
      - 'P P'
    ingredients:
      C: green_carpet
      P: '#planks'
      E: emerald

# Geyser 拡張（統合版にカードを見せる）との通信
bridge:
  # false にすると通信しない（統合版にはカードが見えなくなる）
  enabled: true
  # Geyser が動いているマシンの IP アドレス（同じサーバーに入れたときは 127.0.0.1）
  host: 127.0.0.1
  port: 25590
  # Geyser 拡張の config.properties にある key と同じ値を入れる
  key: ''

# Java 版プレイヤーに参加時に送るリソースパック（空なら送らない）
resource-pack:
  url: ''
  # zip の SHA-1（小文字 16 進 40 文字）
  sha1: ''
